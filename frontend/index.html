<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image to Text - Simple & Lightweight OCR</title>
  <meta name="description" content="Extract text from images effortlessly with our lightweight Image to Text tool.">
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header / Navigation -->
  <header class="border-bottom bg-white py-3 shadow-sm">
    <div class="container-fluid px-lg-4 d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-2">
        <div class="brand-icon">
          <i class="bi bi-file-earmark-text"></i>
        </div>
        <div>
          <h1 class="h5 mb-0 fw-bold navbar-brand">Image to Text</h1>
          <small class="text-muted d-none d-sm-inline">Extract text from images effortlessly</small>
        </div>
      </div>
      <div>
        <span class="status-pill ready" id="systemStatus">
          <span class="status-dot"></span>
          <span id="systemStatusText">Ready</span>
        </span>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="container-fluid px-lg-4 py-4 flex-grow-1">
    <div class="row g-4 h-100">
      
      <!-- Left Column: Image Upload & Preview Area -->
      <div class="col-12 col-lg-6">
        <div class="panel-card">
          <div class="panel-header d-flex justify-content-between align-items-center">
            <h2 class="h6 mb-0 fw-semibold text-secondary">
              <i class="bi bi-image me-1 text-primary"></i> Source Image
            </h2>
            <span class="badge bg-light text-secondary border fw-normal" id="imageBadge">No image selected</span>
          </div>

          <div class="panel-body">
            <!-- Dropzone Area (Initial State) -->
            <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Upload image area">
              <div class="upload-icon-wrapper">
                <i class="bi bi-cloud-arrow-up"></i>
              </div>
              <h3 class="h6 fw-semibold mb-1">Click to browse or drag & drop image</h3>
              <p class="text-muted small mb-3">Supports PNG, JPG, JPEG, WEBP, BMP</p>
              
              <div class="d-flex align-items-center gap-2">
                <span class="paste-badge">
                  <i class="bi bi-keyboard me-1"></i> Paste with <kbd>Ctrl</kbd> + <kbd>V</kbd>
                </span>
              </div>

              <!-- Hidden File Input -->
              <input type="file" id="fileInput" accept="image/png, image/jpeg, image/webp, image/bmp, image/gif" class="d-none">
            </div>

            <!-- Preview Area (Shown when image is selected) -->
            <div class="preview-container" id="previewContainer">
              <img id="imagePreview" class="preview-image" alt="Selected image preview">
            </div>

            <!-- File Info Bar -->
            <div class="file-info-bar" id="fileInfoBar">
              <span class="text-truncate me-2" id="fileName">
                <i class="bi bi-file-image me-1"></i> filename.png
              </span>
              <span class="badge bg-white text-muted border fw-normal" id="fileSize">0 KB</span>
            </div>
          </div>

          <div class="panel-footer d-flex justify-content-between align-items-center">
            <small class="text-muted" id="statusMessage">
              <i class="bi bi-info-circle me-1"></i> Select or paste an image to begin
            </small>
            <button type="button" class="btn btn-sm btn-outline-secondary d-none" id="changeImageBtn">
              <i class="bi bi-arrow-repeat me-1"></i> Change Image
            </button>
          </div>
        </div>
      </div>

      <!-- Right Column: Extracted Text Area -->
      <div class="col-12 col-lg-6">
        <div class="panel-card">
          <div class="panel-header d-flex justify-content-between align-items-center">
            <h2 class="h6 mb-0 fw-semibold text-secondary">
              <i class="bi bi-card-text me-1 text-primary"></i> Extracted Text
            </h2>
            <span class="badge bg-light text-secondary border fw-normal" id="charCount">0 characters</span>
          </div>

          <div class="panel-body">
            <div class="text-editor-wrapper">
              <textarea 
                id="extractedTextArea" 
                class="extracted-textarea" 
                placeholder="Extracted text will appear here once processed. You can also type or edit text directly in this box."
                spellcheck="true"
              ></textarea>
            </div>
          </div>

          <div class="panel-footer d-flex justify-content-between align-items-center">
            <button type="button" class="btn btn-outline-secondary d-flex align-items-center gap-1" id="resetBtn">
              <i class="bi bi-arrow-counterclockwise"></i>
              <span>Start Again</span>
            </button>

            <button type="button" class="btn btn-primary d-flex align-items-center gap-1" id="copyBtn">
              <i class="bi bi-clipboard" id="copyIcon"></i>
              <span id="copyBtnText">Copy Text</span>
            </button>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Notification Toast -->
  <div class="toast-container">
    <div id="liveToast" class="toast align-items-center text-bg-dark border-0 shadow" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body d-flex align-items-center gap-2" id="toastMessage">
          <i class="bi bi-check-circle-fill text-success" id="toastIcon"></i>
          <span id="toastText">Action completed successfully</span>
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Application JS -->
  <script src="js/app.js"></script>
</body>
</html>
